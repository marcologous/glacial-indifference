name: FontBakery Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fontbakery:
    name: FontBakery Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Find font files
        run: |
          find . -name '*.ttf' -o -name '*.otf' -o -name '*.glyphs' > font_files.txt || true
          echo "Found font files: $(cat font_files.txt)"

      - name: Run FontBakery
        run: |
          if ls sources/*.glyphs 1> /dev/null 2>&1; then
            fontbakery check-googlefonts --verbose --html reporters/index.html --json reporters/index.json sources/ || exit 0
          else
            echo "No source files found, skipping FontBakery"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-reports
          path: reporters/
          retention-days: 30