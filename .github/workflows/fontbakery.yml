name: FontBakery Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fontbakery:
    name: FontBakery Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build TTF fonts from source
        run: |
          mkdir -p build/ttf
          fontmake -g sources/GlacialIndifference.glyphs -o ttf --output-dir build/ttf
        continue-on-error: true

      - name: Run post-build FontBakery fixes
        run: python3 fix-fontbakery.py || true

      - name: Run FontBakery quality checks
        id: checks
        run: |
          echo "--- Running FontBakery check-googlefonts ---"
          fontbakery check-googlefonts build/ttf/*.ttf --json reporters/index.json --html reporters/index.html 2>&1 | tee reporters/fontbakery.log || true

      - name: Parse FontBakery results
        run: |
          echo ""
          echo "=== FontBakery Summary ==="
          if grep -q "Total:" reporters/fontbakery.log; then
            grep -A8 "Total:" reporters/fontbakery.log | tail -8
          else
            echo "FontBakery did not produce a summary (check may have failed)"
          fi

          # Count results
          ERROR_COUNT=$(grep "^    ERROR:" reporters/fontbakery.log | grep -oP '\d+' | head -1 || echo "0")
          FAIL_COUNT=$(grep "^    FAIL:" reporters/fontbakery.log | grep -oP '\d+' | head -1 || echo "0")
          WARN_COUNT=$(grep "^    WARN:" reporters/fontbakery.log | grep -oP '\d+' | head -1 || echo "0")
          PASS_COUNT=$(grep "^    PASS:" reporters/fontbakery.log | grep -oP '\d+' | head -1 || echo "0")

          echo ""
          echo "  ERROR: $ERROR_COUNT"
          echo "  FAIL:  $FAIL_COUNT"
          echo "  WARN:  $WARN_COUNT"
          echo "  PASS:  $PASS_COUNT"
          echo ""

          # Fail the job if there are ERRORs (tooling bugs) or known source issues
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "::error::FontBakery ERROR: $ERROR_COUNT errors detected — this is a tooling bug. Check the FontBakery tool version."
          fi
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::warning::FontBakery FAIL: $FAIL_COUNT failures detected — source-level fixes needed in Glyphs."
          fi

      - name: Upload FontBakery reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-reports-${{ github.run_number }}
          path: reporters/
          retention-days: 30